[package]
name = "demo_token"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Freely mintable public test token for the Allowance demo"

[dependencies]
tari_template_lib = { version = "0.38" }

[profile.release]
opt-level = 's'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[lib]
crate-type = ["cdylib"]

[workspace]
