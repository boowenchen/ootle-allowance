[package]
name = "allowance"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Spend-limited accounts for AI agents on Tari Ootle"

[dependencies]
tari_template_lib = { version = "0.38" }

[dev-dependencies]
tari_template_test_tooling = "0.50"

[profile.release]
opt-level = 's'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

# Wasmer and Cranelift are very slow in debug builds, which makes template tests slow.
[profile.dev.package.wasmer]
opt-level = 2
[profile.dev.package.wasmer-compiler]
opt-level = 2
[profile.dev.package.wasmer-compiler-cranelift]
opt-level = 2
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2

[lib]
crate-type = ["cdylib"]
